site_name: Meerkat docs
site_description: >-
  Documentation for Meerkat by Blank Cut, the platform that builds, deploys and
  runs your apps, and for the blankcut CLI that drives it.
site_url: https://docs.blankcut.com
# Rendered in the footer bar on every page (HTML is allowed here).
copyright: >-
  &copy; Meerkat by Blank Cut
  &middot; <a href="https://meerkat.blankcut.com">Console</a>
  &middot; <a href="https://status.blankcut.com">Status</a>

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Overpass
    code: Overpass Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  # Drop the "Made with Material for MkDocs" line; keep the copyright bar,
  # which carries the console and status links.
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/rotator.js

nav:
  - Home: index.md
  - Meerkat CLI:
      - cli/index.md
      - Deploy an app: cli/deploy.md
      - Read your environment: cli/context.md
      - Secrets: cli/secrets.md
      - File storage: cli/storage.md
      - Scheduled jobs: cli/schedule.md
      - Image scanning: cli/scan.md
      - Domains: cli/domains.md
      - Supported stacks: cli/stacks.md
      - Coding agents: cli/agents.md
      - Command reference: cli/commands.md
  - Kubernetes MCP Server:
      - kubernetes-mcp-server/index.md
      - Quick start: kubernetes-mcp-server/quick-start.md
      - Installation: kubernetes-mcp-server/installation.md
      - Configuration: kubernetes-mcp-server/configuration.md
      - API reference: kubernetes-mcp-server/api-overview.md
      - Troubleshooting: kubernetes-mcp-server/troubleshooting-resources.md
      - How it works: kubernetes-mcp-server/model-context-protocol.md
  # Each additional tool/product gets its own folder under docs/ and a block here.
